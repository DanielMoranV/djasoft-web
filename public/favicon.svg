<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Djasoft">
  <!--
    Segunda version de la marca. La primera era la letra D como trazado
    tipografico (trazo/contratrazo, barriga hueca); esta es una silueta
    abstracta que solo recuerda a una D —plana a la izquierda, redondeada a la
    derecha— sin leerse como letra. Dentro va el puente: un bloque anclado
    abajo a la izquierda (lo que ya funciona) conectado en angulo recto, no en
    diagonal, a uno nuevo arriba a la derecha (lo que se construye encima). El
    angulo recto es a proposito: lee como trazo de circuito, no como una
    conexion generica, y no mete una curva donde el resto del sitio declara
    esquina cero (la variable radius del tema en initial, en global.css).

    Sin fondo cuadrado detras: la silueta ES el fondo. El apple-touch-icon si
    lleva un fondo solido propio, porque iOS no tolera bien la transparencia.
  -->
  <path fill="#1b4965" d="M3 2H15A14 14 0 0 1 15 30H3Z"/>
  <path d="M10.5 19V16.5H20.5V14" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="7" y="19" width="7" height="7" rx="1" fill="#fff"/>
  <rect x="17" y="7" width="7" height="7" rx="1" fill="#c8873a"/>
</svg>
