<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Djasoft">
  <!--
    La D va dibujada como trazado, no como <text>: un favicon con texto depende
    de que el sistema del visitante tenga la fuente, y a 16 px eso se nota.

    Fondo solido en el azul de marca para que se lea igual sobre pestanas claras
    y oscuras. El contrapunzon va en ambar, que es el color de accion del sitio:
    a 16 px se distingue de un vistazo del favicon del perfil tecnico, que usa
    la misma letra sobre otro azul.
  -->
  <rect width="32" height="32" rx="7" fill="#1b4965"/>
  <path fill="#fff" fill-rule="evenodd" d="M9 7h7a9 9 0 0 1 0 18H9V7Zm4 4v10h3a5 5 0 0 0 0-10h-3Z"/>
  <path fill="#c8873a" d="M13 11v10h3a5 5 0 0 0 0-10h-3Z"/>
</svg>
